<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رؤية التعليمية</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--primary:#183d78;--accent:#2459d6;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--success:#14804a;--danger:#c0392b}
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#102e5d,#1d58b5);color:white;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:14px} .logo{width:68px;height:68px;border-radius:16px;object-fit:cover;background:#fff}
.brand h1{margin:0;font-size:25px} .brand p{margin:4px 0 0;font-size:13px;opacity:.85}
.container{max-width:1200px;margin:22px auto;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 24px rgba(20,45,80,.06)}
.stat .n{font-size:28px;font-weight:700;color:var(--primary)} .stat .l{color:var(--muted);font-size:13px;margin-top:5px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.primary{background:var(--primary);color:#fff} .blue{background:var(--accent);color:#fff} .light{background:#eef3ff;color:var(--primary)}
.danger{background:#fff0ee;color:var(--danger)} button:disabled{opacity:.5;cursor:not-allowed}
.panel{display:none} .panel.active{display:block}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,select{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit;background:#fff}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px} .full{grid-column:1/-1}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:15px}
table{width:100%;border-collapse:collapse;min-width:760px;background:#fff} th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap} th{background:#f0f4fa;color:var(--primary);font-size:13px} tr:last-child td{border-bottom:0}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf4ff;color:var(--primary);font-size:12px;font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end} .toolbar .field{min-width:230px;flex:1}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;display:none} .ok{display:block;background:#eaf8f0;color:var(--success)} .err{display:block;background:#fff0ee;color:var(--danger)}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:800px){.grid,.actions{grid-template-columns:1fr 1fr} .formgrid{grid-template-columns:1fr}}
@media(max-width:520px){.grid,.actions{grid-template-columns:1fr} header{position:static} .brand h1{font-size:20px} .logo{width:54px;height:54px}}
</style>
</head>

    <div><h1>رؤية التعليمية</h1><p>منصة إدارة الطلاب والدرجات</p></div>
  </div>
  <button class="light" onclick="loadData()">تحديث البيانات</button>
</header>

<div class="container">
  <div class="grid">
    <div class="card stat"><div class="n" id="countAll">0</div><div class="l">إجمالي الطلاب</div></div>
    <div class="card stat"><div class="n" id="countM">0</div><div class="l">عدد الطلاب</div></div>
    <div class="card stat"><div class="n" id="countF">0</div><div class="l">عدد الطالبات</div></div>
    <div class="card stat"><div class="n" id="countTests">0</div><div class="l">عدد الاختبارات</div></div>
  </div>

  <div class="actions">
    <button class="primary" onclick="showPanel('add')">➕ إضافة طالب جديد</button>
    <button class="blue" onclick="newTest()">📝 إضافة درجة / اختبار جديد</button>
    <button class="light" onclick="showPanel('edit')">✏️ تعديل درجة</button>
  </div>

  <div id="add" class="card panel">
    <h2>إضافة طالب جديد</h2>
    <div class="formgrid">
      <div class="full"><label>اسم الطالب</label><input id="name" placeholder="اكتب الاسم بالكامل"></div>
      <div><label>النوع</label><select id="gender"><option value="M">طالب</option><option value="F">طالبة</option></select></div>
      <div><label>الرقم الشخصي</label><input id="personal" inputmode="numeric"></div>
      <div><label>رقم ولي الأمر</label><input id="guardian" inputmode="tel"></div>
      <div class="full"><button class="primary" onclick="saveStudent()">تسجيل الطالب وإنشاء الكود تلقائيًا</button></div>
    </div>
    <div id="addMsg" class="msg"></div>
  </div>

  <div id="edit" class="card panel">
    <h2>تعديل درجات الطالب</h2>
    <div class="toolbar">
      <div class="field"><label>اختر الطالب</label><select id="studentSelect" onchange="loadSelectedStudent()"></select></div>
    </div>
    <div id="gradesArea"></div>
    <div id="editMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="field"><label>بحث بالاسم أو الكود</label><input id="search" oninput="renderTable()" placeholder="مثال: سيد أو S1M1"></div>
      <button class="light" onclick="showPanel('');renderTable()">📋 عرض كل الطلاب</button>
    </div>
    <div class="table-wrap"><table id="studentsTable"></table></div>
  </div>
</div>
<div class="footer">رؤية التعليمية — إدارة الطلاب والدرجات</div>

<script>
let state={headers:[],rows:[]};
function showPanel(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));if(id)document.getElementById(id).classList.add('active');}
function msg(id,text,ok){const e=document.getElementById(id);e.textContent=text;e.className='msg '+(ok?'ok':'err');}
function loadData(){
  google.script.run.withSuccessHandler(d=>{state=d;updateStats();populateStudents();renderTable();}).withFailureHandler(e=>alert(e.message)).getData();
}
function updateStats(){
  const rows=state.rows; document.getElementById('countAll').textContent=rows.length;
  document.getElementById('countM').textContent=rows.filter(r=>r[2]==='طالب').length;
  document.getElementById('countF').textContent=rows.filter(r=>r[2]==='طالبة').length;
  document.getElementById('countTests').textContent=state.headers.filter(h=>/^T\d+$/i.test(h)).length;
}
function populateStudents(){
  const s=document.getElementById('studentSelect'); s.innerHTML='<option value="">اختر الطالب</option>';
  state.rows.forEach(r=>s.innerHTML+=`<option value="${esc(r[0])}">${esc(r[0])} — ${esc(r[1])}</option>`);
}
function renderTable(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const rows=state.rows.filter(r=>!q||String(r[0]).toLowerCase().includes(q)||String(r[1]).toLowerCase().includes(q));
  let h='<thead><tr>'+state.headers.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr>'+state.headers.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')+'</tr>'});
  h+='</tbody>';document.getElementById('studentsTable').innerHTML=h;
}
function saveStudent(){
  const data={name:name.value,gender:gender.value,personal:personal.value,guardian:guardian.value};
  if(!data.name.trim()) return msg('addMsg','اكتب اسم الطالب أولًا.',false);
  google.script.run.withSuccessHandler(r=>{
    msg('addMsg','تم التسجيل بنجاح. الكود: '+r.code,true);
    name.value='';personal.value='';guardian.value='';loadData();
  }).withFailureHandler(e=>msg('addMsg',e.message,false)).addStudent(data);
}
function newTest(){
  if(!confirm('إضافة اختبار جديد؟ سيتم إنشاء عمود جديد باسم T تلقائيًا.')) return;
  google.script.run.withSuccessHandler(t=>{alert('تم إنشاء الاختبار '+t);loadData();showPanel('edit');}).withFailureHandler(e=>alert(e.message)).addTest();
}
function loadSelectedStudent(){
  const code=document.getElementById('studentSelect').value, area=document.getElementById('gradesArea');
  if(!code){area.innerHTML='';return;}
  const row=state.rows.find(r=>String(r[0])===String(code)); if(!row)return;
  const tests=state.headers.map((h,i)=>({h,i})).filter(x=>/^T\d+$/i.test(x.h));
  if(!tests.length){area.innerHTML='<p>لا توجد اختبارات بعد. اضغط «إضافة درجة / اختبار جديد».</p>';return;}
  let html='<div class="table-wrap"><table><thead><tr><th>الاختبار</th><th>الدرجة</th><th>حفظ</th></tr></thead><tbody>';
  tests.forEach(t=>{html+=`<tr><td><span class="badge">${esc(t.h)}</span></td><td><input id="g_${t.h}" type="number" step="any" value="${esc(row[t.i]??'')}"></td><td><button class="primary" onclick="saveGrade('${esc(code)}','${esc(t.h)}')">حفظ</button></td></tr>`;});
  html+='</tbody></table></div>';area.innerHTML=html;
}
function saveGrade(code,test){
  const val=document.getElementById('g_'+test).value;
  google.script.run.withSuccessHandler(()=>{msg('editMsg','تم حفظ درجة '+test+' للطالب '+code,true);loadData();})
    .withFailureHandler(e=>msg('editMsg',e.message,false)).updateGrade(code,test,val);
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
loadData();
</script>
</body>
</html>
